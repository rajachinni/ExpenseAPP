<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 930" width="1480" height="930" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8710A"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#80868b"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1480" height="930" fill="#FAFBFC"/>

  <!-- title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#202124">Expense Tracker — Current Architecture</text>
  <text x="40" y="80" font-size="14.5" fill="#5f6368">iPhone SMS → Shortcut → Google Form → Google Sheet (Apps Script + formulas) → reports · as of Nov 2026</text>

  <!-- ===================== LANE 1: iPhone ===================== -->
  <rect x="30" y="105" width="340" height="700" rx="18" fill="#EEF3FE" stroke="#4A7BE0" stroke-width="1.5"/>
  <text x="54" y="137" font-size="15" font-weight="700" fill="#2754B8" letter-spacing="0.6">iPHONE</text>

  <!-- SMS -->
  <g filter="url(#sh)">
    <rect x="54" y="155" width="292" height="92" rx="12" fill="#fff" stroke="#C6D5F7"/>
  </g>
  <text x="72" y="183" font-size="15.5" font-weight="700" fill="#202124">Bank SMS</text>
  <circle cx="78" cy="206" r="4.5" fill="#1E8E3E"/>
  <text x="90" y="211" font-size="13" fill="#3c4043">ICICI Bank — captured automatically</text>
  <circle cx="78" cy="229" r="4.5" fill="#80868b"/>
  <text x="90" y="234" font-size="13" fill="#3c4043">Axis Bank — run by hand (curated)</text>

  <!-- Automation -->
  <g filter="url(#sh)">
    <rect x="54" y="285" width="292" height="86" rx="12" fill="#fff" stroke="#C6D5F7"/>
  </g>
  <text x="72" y="313" font-size="15.5" font-weight="700" fill="#202124">iOS Automation</text>
  <text x="72" y="336" font-size="13" fill="#3c4043">When message contains “ICICI Bank”</text>
  <text x="72" y="356" font-size="13" fill="#3c4043">Run immediately (no confirmation)</text>

  <!-- Shortcut -->
  <g filter="url(#sh)">
    <rect x="54" y="410" width="292" height="214" rx="12" fill="#fff" stroke="#4A7BE0" stroke-width="1.5"/>
  </g>
  <text x="72" y="439" font-size="15.5" font-weight="700" fill="#202124">Shortcut · Log Transaction V2</text>
  <g font-size="13" fill="#3c4043">
    <circle cx="82" cy="465" r="10" fill="#E8F0FE"/><text x="78" y="469.5" font-size="11.5" font-weight="700" fill="#2754B8">1</text>
    <text x="100" y="469">Message ← SMS text</text>
    <text x="100" y="485" font-size="11.5" fill="#80868b">(asks for text if run with no input)</text>
    <circle cx="82" cy="510" r="10" fill="#E8F0FE"/><text x="78" y="514.5" font-size="11.5" font-weight="700" fill="#2754B8">2</text>
    <text x="100" y="514">Append PENDING to Apple Note</text>
    <circle cx="82" cy="545" r="10" fill="#E8F0FE"/><text x="78" y="549.5" font-size="11.5" font-weight="700" fill="#2754B8">3</text>
    <text x="100" y="549">POST to Google Form</text>
    <circle cx="82" cy="580" r="10" fill="#E8F0FE"/><text x="78" y="584.5" font-size="11.5" font-weight="700" fill="#2754B8">4</text>
    <text x="100" y="584">Append SUCCESS to Apple Note</text>
    <text x="72" y="610" font-size="11.5" fill="#c5221f">No retry · no duplicate check</text>
  </g>

  <!-- Apple Notes -->
  <g filter="url(#sh)">
    <rect x="54" y="662" width="292" height="118" rx="12" fill="#FFFBEA" stroke="#F2C94C"/>
  </g>
  <text x="72" y="690" font-size="15.5" font-weight="700" fill="#202124">Apple Notes · capture log</text>
  <circle cx="78" cy="716" r="5" fill="#D93025"/>
  <text x="90" y="720.5" font-size="13" fill="#3c4043">PENDING → “2026 transactions part 2”</text>
  <circle cx="78" cy="742" r="5" fill="#1E8E3E"/>
  <text x="90" y="746.5" font-size="13" fill="#3c4043">SUCCESS → “2026 temp folder”</text>
  <text x="72" y="768" font-size="11.5" fill="#80868b">PENDING without SUCCESS = failed send</text>

  <!-- lane-1 arrows -->
  <line x1="200" y1="247" x2="200" y2="281" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="200" y1="371" x2="200" y2="406" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>
  <!-- manual Axis path -->
  <path d="M54,229 C22,229 22,470 50,470" fill="none" stroke="#80868b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <line x1="200" y1="624" x2="200" y2="658" stroke="#3c4043" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- ===================== LANE 2: Google Form ===================== -->
  <rect x="400" y="105" width="270" height="700" rx="18" fill="#F4EFFE" stroke="#7C4DDB" stroke-width="1.5"/>
  <text x="424" y="137" font-size="15" font-weight="700" fill="#5B2DBA" letter-spacing="0.6">GOOGLE FORMS</text>

  <g filter="url(#sh)">
    <rect x="422" y="410" width="226" height="214" rx="12" fill="#fff" stroke="#7C4DDB" stroke-width="1.5"/>
  </g>
  <text x="440" y="439" font-size="15.5" font-weight="700" fill="#202124">Form “Expenses”</text>
  <text x="440" y="462" font-size="12.5" fill="#5f6368">POST /formResponse</text>
  <text x="440" y="480" font-size="12.5" fill="#5f6368">x-www-form-urlencoded</text>
  <rect x="440" y="494" width="190" height="30" rx="7" fill="#EDE5FD"/>
  <text x="452" y="514" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#3B1A8F">entry.&lt;FIELD_ID&gt; = SMS</text>
  <text x="440" y="550" font-size="12.5" fill="#3c4043">Only field that is sent.</text>
  <text x="440" y="574" font-size="12.5" fill="#80868b">Category &amp; Split questions</text>
  <text x="440" y="592" font-size="12.5" fill="#80868b">still exist but are unused</text>
  <text x="440" y="612" font-size="11.5" fill="#80868b">~1,075 responses</text>

  <!-- Shortcut -> Form -->
  <line x1="346" y1="545" x2="418" y2="545" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="382" y="535" font-size="11.5" fill="#5f6368" text-anchor="middle">HTTPS</text>

  <!-- ===================== LANE 3: Google Sheet ===================== -->
  <rect x="700" y="105" width="750" height="700" rx="18" fill="#ECF7EF" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="724" y="137" font-size="15" font-weight="700" fill="#137333" letter-spacing="0.6">GOOGLE SHEET · “2026 Financial Expenses”</text>

  <!-- Apps Script -->
  <g filter="url(#sh)">
    <rect x="724" y="155" width="340" height="172" rx="12" fill="#FFF4E5" stroke="#E8710A" stroke-width="1.5"/>
  </g>
  <text x="742" y="183" font-size="15.5" font-weight="700" fill="#202124">Apps Script (bound)</text>
  <text x="742" y="206" font-size="12.5" fill="#3c4043">Trigger: On form submit →</text>
  <text x="742" y="224" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#B05300">retryFailedRows()</text>
  <text x="742" y="244" font-size="12" fill="#c5221f">re-scans every row on each submit</text>
  <text x="742" y="268" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#B05300">extractMerchantAndAmount()</text>
  <text x="742" y="288" font-size="12" fill="#5f6368">amount regex + first matching rule</text>
  <text x="742" y="308" font-size="12" fill="#5f6368">writes merchant → B, amount → C</text>

  <!-- Rules -->
  <g filter="url(#sh)">
    <rect x="1100" y="155" width="326" height="76" rx="12" fill="#fff" stroke="#A8DAB5"/>
  </g>
  <text x="1118" y="183" font-size="15" font-weight="700" fill="#202124">Rules</text>
  <text x="1118" y="205" font-size="12.5" fill="#3c4043">13 SMS parsing rules per bank/format</text>
  <text x="1118" y="222" font-size="11.5" fill="#80868b">Contains · Start · End · Start / Refine regex</text>

  <!-- Expense Mapping -->
  <g filter="url(#sh)">
    <rect x="1100" y="251" width="326" height="76" rx="12" fill="#fff" stroke="#A8DAB5"/>
  </g>
  <text x="1118" y="279" font-size="15" font-weight="700" fill="#202124">Expense Mapping</text>
  <text x="1118" y="301" font-size="12.5" fill="#3c4043">~360 merchants → name + category</text>
  <text x="1118" y="318" font-size="11.5" fill="#80868b">new merchants appended by script</text>

  <!-- script <-> config -->
  <line x1="1064" y1="193" x2="1096" y2="193" stroke="#E8710A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
  <line x1="1064" y1="289" x2="1096" y2="289" stroke="#E8710A" stroke-width="1.6" marker-end="url(#arrO)"/>

  <!-- Form Responses 3 -->
  <g filter="url(#sh)">
    <rect x="724" y="372" width="702" height="160" rx="12" fill="#fff" stroke="#1E8E3E" stroke-width="1.5"/>
  </g>
  <text x="742" y="400" font-size="15.5" font-weight="700" fill="#202124">Form Responses 3</text>
  <text x="900" y="400" font-size="12.5" fill="#5f6368">one row per SMS · ~1,045 rows · 17 columns</text>

  <!-- column chips -->
  <rect x="742" y="416" width="158" height="98" rx="9" fill="#F3EEFE" stroke="#C9B6F2"/>
  <text x="756" y="438" font-size="12.5" font-weight="700" fill="#5B2DBA">From the form</text>
  <text x="756" y="459" font-size="12" fill="#3c4043">A  Timestamp</text>
  <text x="756" y="477" font-size="12" fill="#3c4043">E  Split</text>
  <text x="756" y="495" font-size="12" fill="#3c4043">F  Message</text>

  <rect x="914" y="416" width="158" height="98" rx="9" fill="#FFF4E5" stroke="#F5C08A"/>
  <text x="928" y="438" font-size="12.5" font-weight="700" fill="#B05300">From the script</text>
  <text x="928" y="459" font-size="12" fill="#3c4043">B  Merchant</text>
  <text x="928" y="477" font-size="12" fill="#3c4043">C  Amount</text>

  <rect x="1086" y="416" width="158" height="98" rx="9" fill="#E6F4EA" stroke="#A8DAB5"/>
  <text x="1100" y="438" font-size="12.5" font-weight="700" fill="#137333">Formulas</text>
  <text x="1100" y="459" font-size="12" fill="#3c4043">G, O  lookup name/cat.</text>
  <text x="1100" y="477" font-size="12" fill="#3c4043">D, I, L  pick override</text>
  <text x="1100" y="495" font-size="12" fill="#3c4043">J  split amount</text>

  <rect x="1258" y="416" width="152" height="98" rx="9" fill="#F1F3F4" stroke="#DADCE0"/>
  <text x="1272" y="438" font-size="12.5" font-weight="700" fill="#3c4043">Typed by hand</text>
  <text x="1272" y="459" font-size="12" fill="#3c4043">H  Status</text>
  <text x="1272" y="477" font-size="12" fill="#3c4043">K, P  name / category</text>
  <text x="1272" y="495" font-size="12" fill="#3c4043">M, N, Q  date/share/note</text>

  <!-- Form -> Form Responses -->
  <path d="M648,545 C684,545 690,480 720,470" fill="none" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="686" y="600" font-size="11.5" fill="#5f6368" text-anchor="middle">new row</text>

  <!-- trigger & write-back between FR3 and script -->
  <line x1="860" y1="370" x2="860" y2="331" stroke="#E8710A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrO)"/>
  <text x="868" y="355" font-size="11.5" fill="#B05300">on submit</text>
  <line x1="992" y1="327" x2="992" y2="368" stroke="#E8710A" stroke-width="1.8" marker-end="url(#arrO)"/>
  <text x="1000" y="355" font-size="11.5" fill="#B05300">writes B, C</text>

  <!-- mapping lookup -->
  <line x1="1165" y1="327" x2="1165" y2="368" stroke="#1E8E3E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="1173" y="355" font-size="11.5" fill="#137333">XLOOKUP</text>

  <!-- derived views -->
  <text x="742" y="566" font-size="11.5" font-weight="700" fill="#137333" letter-spacing="0.5">DERIVED VIEWS</text>
  <g filter="url(#sh)">
    <rect x="724" y="578" width="300" height="78" rx="12" fill="#fff" stroke="#A8DAB5"/>
    <rect x="1040" y="578" width="185" height="78" rx="12" fill="#fff" stroke="#A8DAB5"/>
    <rect x="1241" y="578" width="185" height="78" rx="12" fill="#fff" stroke="#A8DAB5"/>
  </g>
  <text x="742" y="604" font-size="15" font-weight="700" fill="#202124">MasterExpenses</text>
  <text x="742" y="625" font-size="12" fill="#3c4043">Status ∈ Valid, RegexIssues, Pending Split</text>
  <text x="742" y="643" font-size="12" fill="#5f6368">splits fanned out · + Group column</text>
  <text x="1058" y="604" font-size="15" font-weight="700" fill="#202124">RegexIssues</text>
  <text x="1058" y="625" font-size="12" fill="#3c4043">rows to fix by hand</text>
  <text x="1259" y="604" font-size="15" font-weight="700" fill="#202124">Split Transactions</text>
  <text x="1259" y="625" font-size="12" fill="#3c4043">Pending Split rows</text>

  <line x1="940" y1="532" x2="940" y2="574" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="1132" y1="532" x2="1132" y2="574" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="1333" y1="532" x2="1333" y2="574" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- reports -->
  <text x="742" y="688" font-size="11.5" font-weight="700" fill="#137333" letter-spacing="0.5">REPORTS (SUMIFS)</text>
  <g filter="url(#sh)">
    <rect x="724" y="700" width="340" height="82" rx="12" fill="#fff" stroke="#1E8E3E"/>
    <rect x="1100" y="700" width="326" height="82" rx="12" fill="#fff" stroke="#1E8E3E"/>
  </g>
  <text x="742" y="727" font-size="15" font-weight="700" fill="#202124">Yearly Inflow &amp; Outflow</text>
  <text x="742" y="748" font-size="12" fill="#3c4043">category × month totals, group subtotals</text>
  <text x="742" y="766" font-size="12" fill="#5f6368">monthly · quarterly · yearly % stats</text>
  <text x="1118" y="727" font-size="15" font-weight="700" fill="#202124">Statistics</text>
  <text x="1118" y="748" font-size="12" fill="#3c4043">spent vs monthly limit per category</text>
  <text x="1118" y="766" font-size="12" fill="#5f6368">gauge images via quickchart.io</text>

  <line x1="940" y1="656" x2="940" y2="696" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="1064" y1="741" x2="1096" y2="741" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===================== LEGEND ===================== -->
  <rect x="30" y="830" width="1420" height="72" rx="14" fill="#fff" stroke="#E0E3E7"/>
  <text x="54" y="859" font-size="12.5" font-weight="700" fill="#5f6368" letter-spacing="0.5">LEGEND</text>
  <line x1="54" y1="881" x2="96" y2="881" stroke="#3c4043" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="106" y="885" font-size="12.5" fill="#3c4043">data flow</text>
  <line x1="196" y1="881" x2="238" y2="881" stroke="#3c4043" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="248" y="885" font-size="12.5" fill="#3c4043">read / lookup / trigger</text>
  <rect x="410" y="872" width="18" height="18" rx="4" fill="#FFF4E5" stroke="#E8710A"/>
  <text x="436" y="885" font-size="12.5" fill="#3c4043">code (Apps Script)</text>
  <rect x="580" y="872" width="18" height="18" rx="4" fill="#E6F4EA" stroke="#A8DAB5"/>
  <text x="606" y="885" font-size="12.5" fill="#3c4043">spreadsheet formulas</text>
  <rect x="770" y="872" width="18" height="18" rx="4" fill="#F1F3F4" stroke="#DADCE0"/>
  <text x="796" y="885" font-size="12.5" fill="#3c4043">manual input</text>
  <text x="920" y="885" font-size="12.5" fill="#c5221f">red text = known weakness (see REQUIREMENTS.md §5)</text>
</svg>
